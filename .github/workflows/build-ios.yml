name: Build Shattered PD iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Force Unsigned IPA
        run: ./gradlew :ios:createIpa -Probovm.iosSkipSigning=true --no-daemon

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pd-ipa
          path: ios/build/robovm/*.ipa
